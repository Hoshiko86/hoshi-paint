[workspace]
members = ["crates/hoshi-core", "crates/hoshi-controller", "spikes/desktop-canvas", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

# Third-party crates (Slint, image codecs, zbus, ...) build without debug info
# in dev and test builds. That debug info was most of every test binary
# (~0.5 GB each) and of the build cache. Workspace crates keep full debug info,
# and backtraces still name third-party functions (symbols are kept).
[profile.dev.package."*"]
debug = false

# Keep debug symbols and checks in development artifacts, but optimize the
# per-pixel hot paths so interactive resizing does not run at opt-level 0.
[profile.dev.package.hoshi-core]
opt-level = 3

[profile.dev.package.hoshi-controller]
opt-level = 3

[profile.dev.package.i-slint-renderer-software]
opt-level = 3

[profile.dev.package.i-slint-core]
opt-level = 3

[profile.dev.package.hoshi-canvas-spike]
opt-level = 2
