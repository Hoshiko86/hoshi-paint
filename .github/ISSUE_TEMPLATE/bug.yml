name: Bug
description: Unexpected editing or platform behavior
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior, and actual behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, application version, and hardware
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and document impact
      description: Mention lost work or save corruption. Do not attach private artwork without permission.
