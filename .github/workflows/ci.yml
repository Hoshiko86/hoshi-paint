name: Desktop canvas and core
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  project-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s scripts -v
  core:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-x11-0 libxfixes3 dbus xvfb
      - name: Install pinned Rust
        run: rustup show
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --package hoshi-canvas-spike --locked
      - name: Real Linux desktop backend smoke test
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
          HOSHI_SPIKE_SNAPSHOT: target/spike-desktop.png
          HOSHI_SPIKE_EDITABLE_SNAPSHOT: target/spike-handles.png
        run: xvfb-run -a cargo run --package hoshi-canvas-spike --example desktop_smoke --locked
      - name: Real Linux color picker smoke test
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
          HOSHI_COLOR_SNAPSHOT: target/spike-colors.png
          HOSHI_DOCK_SNAPSHOT: target/spike-colors-docked.png
        run: xvfb-run -a cargo run --package hoshi-canvas-spike --example color_smoke --locked
      - name: Native document tabs and save prompts smoke test
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
          HOSHI_DOCUMENT_SNAPSHOT_DIR: target
        run: xvfb-run -a -s '-screen 0 1280x960x24' cargo run --package hoshi-canvas-spike --example documents_smoke --locked
      - name: Native image and canvas settings smoke test
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
          HOSHI_IMAGE_SNAPSHOT_DIR: target
        run: xvfb-run -a cargo run --package hoshi-canvas-spike --example image_settings_smoke --locked
      - name: Native docked panels and history smoke test
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
          HOSHI_PANELS_SNAPSHOT: target/spike-panels.png
          HOSHI_HISTORY_SNAPSHOT: target/spike-history.png
        run: xvfb-run -a -s '-screen 0 1600x1000x24' cargo run --package hoshi-canvas-spike --example panels_smoke --locked
      - name: Desktop screen picker portal contract
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo run --package hoshi-canvas-spike --example portal_smoke --locked
      - name: Native eyedropper cursor at 1x and 2x
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit-software
        run: |
          cargo build --package hoshi-canvas-spike --example cursor_smoke --locked
          SLINT_SCALE_FACTOR=1 xvfb-run -a target/debug/examples/cursor_smoke
          SLINT_SCALE_FACTOR=2 xvfb-run -a -s '-screen 0 2560x1800x24' target/debug/examples/cursor_smoke
      - name: Include license notices with debug artifacts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          package = Path("target/spike-package")
          package.mkdir(parents=True, exist_ok=True)
          for source in ["target/debug/hoshi-canvas-spike", "target/debug/hoshi-canvas-spike.exe",
                         "target/spike-desktop.png", "target/spike-handles.png", "target/spike-colors.png",
                         "target/spike-colors-docked.png", "target/spike-panels.png", "target/spike-history.png",
                         "target/spike-documents.png", "target/spike-save-prompt.png",
                         "target/spike-save-configuration.png", "target/spike-image-new.png", "target/spike-image-resize.png",
                         "target/spike-canvas-size.png", "target/spike-image-edited.png",
                         "LICENSE", "THIRD_PARTY_NOTICES.md"]:
              path = Path(source)
              if path.is_file():
                  shutil.copy2(path, package / path.name)
          shutil.copytree("licenses", package / "licenses", dirs_exist_ok=True)
      - name: Bundle corresponding source and locked dependencies
        run: python3 scripts/package_source.py target/spike-package/hoshi-paint-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: canvas-spike-${{ matrix.os }}
          path: target/spike-package/
          if-no-files-found: error
          retention-days: 14
