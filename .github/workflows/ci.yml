name: Desktop canvas and core
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Decides what the change needs (xtask/src/changed.rs, docs/TESTING.md).
  # Pull requests run only that; pushes to main and manual runs run everything.
  # Later jobs skip steps rather than whole jobs, so required checks report.
  plan:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      smoke: ${{ steps.plan.outputs.smoke }}
      scripts: ${{ steps.plan.outputs.scripts }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # merge-base with the PR's base branch
      - name: Install pinned Rust
        run: rustup show
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'all' }}
        run: |
          cargo xtask ci-plan "$BASE" | tee -a "$GITHUB_OUTPUT"
          { echo '### CI plan'; echo '```'; cat "$GITHUB_OUTPUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  project-sync-tests:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: needs.plan.outputs.scripts == 'true'
        run: python3 -m unittest discover -s scripts -v  # = cargo xtask test scripts, without a Rust toolchain
  core:
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux' && needs.plan.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-x11-0 libxfixes3 dbus xvfb
      - name: Install pinned Rust
        if: needs.plan.outputs.rust == 'true'
        run: rustup show
      - name: Install cargo-nextest (prebuilt, pinned)
        if: needs.plan.outputs.rust == 'true'
        shell: bash
        env:
          NEXTEST: "0.9.151"
        run: |
          case "${{ runner.os }}" in
            Linux) target=x86_64-unknown-linux-gnu ;;
            macOS) target=universal-apple-darwin ;;
            Windows) target=x86_64-pc-windows-msvc ;;
          esac
          # Not ~/.cargo/bin: the macOS image has no such directory. On
          # Windows, Git Bash's tar and PATH need the POSIX form of the path
          # (tar reads "D:" as a remote host), but GITHUB_PATH needs the native one.
          bin="$RUNNER_TEMP/tools"
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          mkdir -p "$bin"
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST/cargo-nextest-$NEXTEST-$target.tar.gz" \
            | tar xzf - -C "$bin"
          if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          PATH="$bin:$PATH" cargo nextest --version
      - if: needs.plan.outputs.rust == 'true'
        run: cargo xtask test lint
      - if: needs.plan.outputs.rust == 'true'
        run: cargo xtask test unit ${{ needs.plan.outputs.packages }}
      - name: Upload test results (JUnit)
        if: always() && needs.plan.outputs.rust == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Native desktop smoke suite (xtask/src/smoke.rs)
        if: needs.plan.outputs.smoke == 'true'
        run: cargo xtask test smoke
      - name: Include license notices with debug artifacts
        if: needs.plan.outputs.smoke == 'true'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          package = Path("target/spike-package")
          package.mkdir(parents=True, exist_ok=True)
          for source in ["target/debug/hoshi-canvas-spike", "target/debug/hoshi-canvas-spike.exe",
                         "LICENSE", "THIRD_PARTY_NOTICES.md"]:
              path = Path(source)
              if path.is_file():
                  shutil.copy2(path, package / path.name)
          # Snapshots written by `cargo xtask test smoke`.
          for snapshot in sorted(Path("target/smoke").glob("*.png")):
              shutil.copy2(snapshot, package / snapshot.name)
          shutil.copytree("licenses", package / "licenses", dirs_exist_ok=True)
      - name: Bundle corresponding source and locked dependencies
        if: needs.plan.outputs.smoke == 'true'
        run: python3 scripts/package_source.py target/spike-package/hoshi-paint-source.tar.gz
      - if: needs.plan.outputs.smoke == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: canvas-spike-${{ matrix.os }}
          path: target/spike-package/
          if-no-files-found: error
          retention-days: 14
  coverage:
    needs: plan
    # Not a matrix, so skipping the whole job still reports a check.
    if: needs.plan.outputs.coverage == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust with LLVM tools
        run: rustup show && rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov (prebuilt, pinned; keep in step with xtask/src/coverage.rs)
        env:
          LLVM_COV: "0.9.1"
        run: |
          bin="$RUNNER_TEMP/tools"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xzf - -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          PATH="$bin:$PATH" cargo llvm-cov --version
      - name: Line coverage with floors (xtask/src/coverage.rs)
        run: cargo xtask test coverage
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Line coverage (hoshi-core, hoshi-controller)'; echo '```';
            cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14
