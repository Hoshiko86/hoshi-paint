name: Desktop canvas and core
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a PR (or a re-dispatch on a branch) cancels that ref's
# still-running CI, so superseded commits stop using runners. Runs on main
# are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Decides what the change needs (xtask/src/changed.rs, docs/TESTING.md).
  # Pull requests run only that; pushes to main and manual runs run everything.
  # Later jobs skip steps rather than whole jobs, so required checks report.
  plan:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      smoke: ${{ steps.plan.outputs.smoke }}
      scripts: ${{ steps.plan.outputs.scripts }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # merge-base with the PR's base branch
      - name: Install pinned Rust
        run: rustup show
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'all' }}
        run: |
          cargo xtask ci-plan "$BASE" | tee -a "$GITHUB_OUTPUT"
          { echo '### CI plan'; echo '```'; cat "$GITHUB_OUTPUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  project-sync-tests:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.plan.outputs.scripts == 'true'
        run: python3 -m unittest discover -s scripts -v  # = cargo xtask test scripts, without a Rust toolchain
  core:
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Line numbers for backtraces without full debug info: smaller objects,
      # faster links. Dependencies already build without debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux' && needs.plan.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-x11-0 libxfixes3 dbus xvfb
      - name: Install pinned Rust
        if: needs.plan.outputs.rust == 'true'
        run: rustup show
      - name: Link with rust-lld on Windows (faster than link.exe)
        if: runner.os == 'Windows' && needs.plan.outputs.rust == 'true'
        shell: pwsh
        run: '"CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> $env:GITHUB_ENV'
      # Restores compiled dependencies; only main saves, so PRs reuse main's
      # cache without filling the repository's 10 GB cache limit.
      - name: Cache Rust builds
        if: needs.plan.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest (prebuilt, pinned)
        if: needs.plan.outputs.rust == 'true'
        shell: bash
        env:
          NEXTEST: "0.9.151"
        run: |
          case "${{ runner.os }}" in
            Linux) target=x86_64-unknown-linux-gnu ;;
            macOS) target=universal-apple-darwin ;;
            Windows) target=x86_64-pc-windows-msvc ;;
          esac
          # Not ~/.cargo/bin: the macOS image has no such directory. On
          # Windows, Git Bash's tar and PATH need the POSIX form of the path
          # (tar reads "D:" as a remote host), but GITHUB_PATH needs the native one.
          bin="$RUNNER_TEMP/tools"
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          mkdir -p "$bin"
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST/cargo-nextest-$NEXTEST-$target.tar.gz" \
            | tar xzf - -C "$bin"
          if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          PATH="$bin:$PATH" cargo nextest --version
      - if: needs.plan.outputs.rust == 'true'
        run: cargo xtask test lint
      - if: needs.plan.outputs.rust == 'true'
        run: cargo xtask test unit ${{ needs.plan.outputs.packages }}
      - name: Upload test results (JUnit)
        if: always() && needs.plan.outputs.rust == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Native desktop smoke suite (xtask/src/smoke.rs)
        if: needs.plan.outputs.smoke == 'true'
        run: cargo xtask test smoke
      - name: Include license notices with debug artifacts
        if: needs.plan.outputs.smoke == 'true'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          package = Path("target/spike-package")
          package.mkdir(parents=True, exist_ok=True)
          for source in ["target/debug/hoshi-desktop", "target/debug/hoshi-desktop.exe",
                         "LICENSE", "THIRD_PARTY_NOTICES.md"]:
              path = Path(source)
              if path.is_file():
                  shutil.copy2(path, package / path.name)
          shutil.copytree("licenses", package / "licenses", dirs_exist_ok=True)
      # GPL-3.0 §6(d): point to the exact source on GitHub instead of bundling
      # a copy with every build. Cargo.lock pins every dependency version.
      - name: Point to the corresponding source
        if: needs.plan.outputs.smoke == 'true'
        shell: python
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          import os, shutil
          from pathlib import Path
          package = Path("target/spike-package")
          package.mkdir(parents=True, exist_ok=True)
          sha, repo = os.environ["SOURCE_SHA"], os.environ["SOURCE_REPO"]
          (package / "SOURCE.md").write_text(
              "# Source\n\n"
              "This build is Hoshi Paint, licensed GPL-3.0-only (see LICENSE).\n"
              f"Its complete source is the commit it was built from:\n\n{repo}/tree/{sha}\n\n"
              f"Download: {repo}/archive/{sha}.tar.gz\n\n"
              "Cargo.lock (included) pins every dependency; each one's source is on\n"
              "crates.io at that exact version. Third-party licenses are in licenses/\n"
              "and THIRD_PARTY_NOTICES.md.\n",
              encoding="utf-8")
          shutil.copy2("Cargo.lock", package / "Cargo.lock")
      - if: needs.plan.outputs.smoke == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: desktop-${{ matrix.os }}
          path: target/spike-package/
          if-no-files-found: error
          retention-days: 14
      # Smoke snapshots in their own artifact, so the app download stays small.
      - if: needs.plan.outputs.smoke == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: smoke-snapshots-${{ matrix.os }}
          path: target/smoke/*.png
          if-no-files-found: warn
          retention-days: 14
  coverage:
    needs: plan
    # Not a matrix, so skipping the whole job still reports a check.
    if: needs.plan.outputs.coverage == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux desktop prerequisites
        # Fontconfig headers/libraries build Slint; tests use the headless testing backend.
        # X11 cursor libraries, Xvfb and D-Bus sessions are needed only by native smoke.
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev
      - name: Install pinned Rust with LLVM tools
        run: rustup show && rustup component add llvm-tools-preview
      # Instrumented builds differ from the core jobs', so they get their own key.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov (prebuilt, pinned; keep in step with xtask/src/coverage.rs)
        env:
          LLVM_COV: "0.9.1"
        run: |
          bin="$RUNNER_TEMP/tools"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xzf - -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          PATH="$bin:$PATH" cargo llvm-cov --version
      - name: Line coverage with floors (xtask/src/coverage.rs)
        run: cargo xtask test coverage
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Line coverage (hoshi-core, hoshi-controller, hoshi-desktop)'; echo '```';
            cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        if: always()
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14
