# Codex's role (AGENTS.md): implementation and PR fixes.
#
# Two ways in:
# - workflow_call from agent-round.yml: Claude's review found in-scope fixes,
#   and Codex applies them automatically (the normal path).
# - An owner PR comment starting with "/codex-fix" (or "/gemini-fix" to use
#   Gemini directly): a manual request. (Any
#   "@codex..." text wakes ChatGPT's own Codex connector, so no @ is used.)
#
# Split in two jobs so PR code never runs next to a write token:
# - implement: read-only token, no git credentials. Checks out the PR, runs
#   Codex (which builds and tests PR code) and uploads the changed files.
# - publish: write token, checks nothing out. Refuses .github/ changes and
#   builds the commit through the Git Data API (fast-forward only).
# If Codex fails (for example, out of OpenAI quota), Gemini runs the same
# prompt in the same read-only job (owner, 2026-11-25).
# Fix commits are pushed with GITHUB_TOKEN, which starts no other workflows,
# so publish also dispatches ci.yml on the PR branch; its checks attach to the
# fix commit.
name: Codex (PR fixes)

on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      request:
        type: string
        required: true
    outputs:
      pushed:
        value: ${{ jobs.publish.outputs.pushed }}
      sha:
        value: ${{ jobs.publish.outputs.sha }}
  issue_comment:
    types: [created]

jobs:
  implement:
    # In a called workflow, github.event is the caller's, so a non-empty
    # `inputs.request` is what marks the workflow_call path.
    if: |
      inputs.request != '' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.author_association == 'OWNER' &&
       (startsWith(github.event.comment.body, '/codex-fix') ||
        startsWith(github.event.comment.body, '/gemini-fix')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: codex-fix-${{ inputs.pr || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      base: ${{ steps.pr.outputs.base }}
      changed: ${{ steps.patch.outputs.changed }}
      agent: ${{ steps.agent.outputs.name }}
    env:
      PR: ${{ inputs.pr || github.event.issue.number }}
      REQUEST: ${{ inputs.request || github.event.comment.body }}
      # "/gemini-fix" skips Codex and runs Gemini directly.
      FORCE_GEMINI: ${{ inputs.request == '' && startsWith(github.event.comment.body, '/gemini-fix') }}
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR),
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs are not supported.');
            }
            if (pr.state !== 'open') {
              core.setFailed('The PR is not open.');
            }
            core.setOutput('ref', pr.head.ref);
            core.setOutput('base', pr.head.sha);

      # Pinned to the head commit read above, with no stored credentials.
      - name: Checkout PR head (read only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Slint Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # rustup reads rust-toolchain.toml (the pinned toolchain with rustfmt and clippy).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Write prompt
        id: prompt
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "You are the implementer for Hoshi Paint, working on the branch of PR #$PR."
            echo "Read AGENTS.md first and follow it strictly, especially §3a \"Review rounds\":"
            echo "fix only what the request lists, only in files this PR already changes, with no"
            echo "behavior change unless the request says so. If a fix needs a file outside the PR,"
            echo "or conflicts with the issue's binding scope, skip it and say so (AGENTS.md §0)."
            echo "Do not edit anything under .github/. Do not commit or push: the workflow does that."
            echo
            echo "The request:"
            printf '%s\n' "$REQUEST"
            echo
            echo "Before finishing, make sure these pass (see docs/TESTING.md):"
            echo "- cargo xtask test lint"
            echo "- cargo xtask test unit"
            echo
            echo "Finish with a short report: each requested fix -> done or skipped (and why), and"
            echo "the command results."
          } > "$RUNNER_TEMP/codex-prompt.md"
          {
            echo "text<<PROMPT_EOF_${GITHUB_RUN_ID}"
            cat "$RUNNER_TEMP/codex-prompt.md"
            echo "PROMPT_EOF_${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Codex
        id: codex
        if: env.FORCE_GEMINI != 'true'
        continue-on-error: true
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/out/codex-report.md
          allow-bot-users: chatgpt-codex-connector[bot]

      # Fallback (owner, 2026-11-25): if Codex fails (for example, out of API
      # quota), Gemini gets the same prompt in the same read-only job. Throw
      # away anything a failed Codex run left behind first.
      - name: Reset after a failed Codex run
        if: steps.codex.outcome == 'failure'
        run: |
          git reset -q --hard HEAD
          git clean -qfd -e target/

      # Free-tier keys have a small daily request limit per model. When it is
      # used up, the CLI keeps retrying for many minutes before failing, so
      # ask the API once first and skip a model whose daily quota is gone
      # (owner, 2026-11-27). A per-minute limit is not skipped: the CLI's own
      # backoff handles that.
      - name: Check Gemini quota (gemini-4-hydrogen)
        id: quota1
        if: steps.codex.outcome == 'failure' || env.FORCE_GEMINI == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: gemini-4-hydrogen
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/quota.json" -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":1}}' \
            "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent" || echo 000)
          if [ "$code" = 429 ] && grep -qiE 'PerDay|per day' "$RUNNER_TEMP/quota.json"; then
            echo "::warning::$MODEL: daily free-tier quota used up; skipping it."
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini (fallback, or forced by /gemini-fix)
        id: gemini
        if: (steps.codex.outcome == 'failure' || env.FORCE_GEMINI == 'true') && steps.quota1.outputs.exhausted != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # The CLI refuses to act in an untrusted folder; this job's checkout
          # is the workspace it is meant to edit (read-only token, no creds).
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Free-tier key (owner, 2026-11-25): flagship Pro models are not
          # included, and the default "auto" routing tries them first and
          # stalls on 503s. Hydrogen is the free-tier model for coding and
          # agentic work; gemini-3.8-flash is tried next if it fails.
          gemini_model: gemini-4-hydrogen
          prompt: ${{ steps.prompt.outputs.text }}
          github_pr_number: ${{ inputs.pr || github.event.issue.number }}

      # If the first Gemini model is unavailable (503 "high demand" is common
      # on the free tier), try a second free-tier model once (owner, 2026-11-25).
      - name: Reset after a failed Gemini run
        if: steps.gemini.outcome == 'failure'
        run: |
          git reset -q --hard HEAD
          git clean -qfd -e target/

      - name: Check Gemini quota (gemini-3.8-flash)
        id: quota2
        if: steps.gemini.outcome == 'failure' || steps.quota1.outputs.exhausted == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: gemini-3.8-flash
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/quota.json" -w '%{http_code}' \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":1}}' \
            "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent" || echo 000)
          if [ "$code" = 429 ] && grep -qiE 'PerDay|per day' "$RUNNER_TEMP/quota.json"; then
            echo "::warning::$MODEL: daily free-tier quota used up; skipping it."
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini (second model)
        id: gemini2
        if: (steps.gemini.outcome == 'failure' || steps.quota1.outputs.exhausted == 'true') && steps.quota2.outputs.exhausted != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          prompt: ${{ steps.prompt.outputs.text }}
          github_pr_number: ${{ inputs.pr || github.event.issue.number }}

      - name: Record which agent ran
        id: agent
        if: always()
        env:
          CODEX: ${{ steps.codex.outcome }}
          GEMINI: ${{ steps.gemini.outcome }}
          GEMINI2: ${{ steps.gemini2.outcome }}
          SUMMARY: ${{ steps.gemini.outputs.summary }}
          SUMMARY2: ${{ steps.gemini2.outputs.summary }}
          QUOTA1: ${{ steps.quota1.outputs.exhausted }}
          QUOTA2: ${{ steps.quota2.outputs.exhausted }}
        run: |
          if [ "$CODEX" = "skipped" ]; then via="Gemini"; else via="Gemini (fallback: Codex failed)"; fi
          if [ "$CODEX" = "success" ]; then
            echo "name=Codex" >> "$GITHUB_OUTPUT"
          elif [ "$GEMINI" = "success" ]; then
            echo "name=$via" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/out/codex-report.md"
          elif [ "$GEMINI2" = "success" ]; then
            echo "name=$via, gemini-3.8-flash" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$SUMMARY2" > "$RUNNER_TEMP/out/codex-report.md"
          else
            if [ "$CODEX" = "skipped" ]; then
              echo "name=Gemini" >> "$GITHUB_OUTPUT"
              echo "::error::Gemini failed with both models (see the Gemini steps above)."
            else
              echo "name=Codex and Gemini" >> "$GITHUB_OUTPUT"
              echo "::error::Codex failed and Gemini failed with both models."
            fi
            if [ "$QUOTA1" = true ] || [ "$QUOTA2" = true ]; then
              used=""
              [ "$QUOTA1" = true ] && used="gemini-4-hydrogen"
              [ "$QUOTA2" = true ] && used="${used:+$used and }gemini-3.8-flash"
              printf '%s\n' "Gemini's daily free-tier limit is used up ($used). It resets at midnight Pacific time; try \`/gemini-fix\` again after that." \
                > "$RUNNER_TEMP/out/codex-report.md"
            fi
            exit 1
          fi

      # Hand over the changed files themselves (not a patch), so publish can
      # build the commit through the API without checking anything out.
      - name: Collect changes
        id: patch
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          git add -A
          python3 -I - "$RUNNER_TEMP/out" <<'PY'
          import json, os, shutil, subprocess, sys
          out = sys.argv[1]
          # Against the exact base commit, so even a local commit by the agent is caught.
          names = subprocess.run(["git", "diff", "--cached", "--name-only", "--no-renames", "-z", os.environ["BASE"]],
                                 check=True, capture_output=True).stdout.split(b"\0")
          changes = []
          for raw in filter(None, names):
              path = raw.decode()
              # Agent tool settings and the Gemini action's run logs
              # (gemini-artifacts/), not part of the fix.
              if path.startswith((".gemini/", ".codex/", "gemini-artifacts/")):
                  continue
              staged = subprocess.run(["git", "ls-files", "-s", "--", path],
                                      check=True, capture_output=True, text=True).stdout.split()
              if staged:
                  dest = os.path.join(out, "files", path)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  if staged[0] == "120000":
                      with open(dest, "w") as f:
                          f.write(os.readlink(path))
                  else:
                      shutil.copyfile(path, dest)
                  changes.append({"path": path, "mode": staged[0]})
              else:
                  changes.append({"path": path, "deleted": True})
          with open(os.path.join(out, "changes.json"), "w") as f:
              json.dump(changes, f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changes else 'false'}\n")
          PY

      - name: Upload changes and report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-fix
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: implement
    if: needs.implement.result == 'success' && needs.implement.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # No checkout: nothing from the PR is ever executed here.
      - name: Download changes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: codex-fix
          path: ${{ runner.temp }}/in

      # Builds the commit with the Git Data API on top of the exact commit
      # Codex worked on; the branch update is a fast-forward only, so it fails
      # if the branch moved meanwhile.
      - name: Commit and push via the API
        id: push
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR: ${{ inputs.pr || github.event.issue.number }}
          BRANCH: ${{ needs.implement.outputs.ref }}
          BASE: ${{ needs.implement.outputs.base }}
          IN: ${{ runner.temp }}/in
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const changes = JSON.parse(fs.readFileSync(path.join(process.env.IN, 'changes.json'), 'utf8'));
            const blocked = changes.filter(c => c.path === '.github' || c.path.startsWith('.github/'));
            if (blocked.length) {
              return core.setFailed(`Codex changed files under .github/; refusing: ${blocked.map(c => c.path).join(', ')}`);
            }
            const tree = [];
            for (const c of changes) {
              if (c.deleted) {
                tree.push({ path: c.path, mode: '100644', type: 'blob', sha: null });
                continue;
              }
              const content = fs.readFileSync(path.join(process.env.IN, 'files', c.path)).toString('base64');
              const { data: blob } = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
              tree.push({ path: c.path, mode: c.mode, type: 'blob', sha: blob.sha });
            }
            const base = process.env.BASE;
            const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: base });
            const { data: newTree } = await github.rest.git.createTree({ owner, repo, base_tree: baseCommit.tree.sha, tree });
            const { data: commit } = await github.rest.git.createCommit({ owner, repo,
              message: `Apply review fixes (#${process.env.PR})`, tree: newTree.sha, parents: [base] });
            // force: false makes this a fast-forward only: it fails if the branch moved.
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${process.env.BRANCH}`, sha: commit.sha, force: false });
            core.setOutput('pushed', 'true');
            core.setOutput('sha', commit.sha);
            // A GITHUB_TOKEN push starts no workflows: run CI on the branch explicitly.
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: process.env.BRANCH });

  reply:
    needs: [implement, publish]
    if: always() && needs.implement.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download report
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: codex-fix
          path: ${{ runner.temp }}/in

      - name: Reply on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR: ${{ inputs.pr || github.event.issue.number }}
          IMPLEMENT: ${{ needs.implement.result }}
          AGENT: ${{ needs.implement.outputs.agent || 'Codex' }}
          PUBLISH: ${{ needs.publish.result }}
          PUSHED: ${{ needs.publish.outputs.pushed }}
          SHA: ${{ needs.publish.outputs.sha }}
          CHAINED: ${{ inputs.request != '' }}
          REPORT: ${{ runner.temp }}/in/codex-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR);
            let report = '';
            try { report = fs.readFileSync(process.env.REPORT, 'utf8').slice(0, 60000); } catch {}
            const failed = process.env.IMPLEMENT !== 'success' ||
              (process.env.PUBLISH !== 'success' && process.env.PUBLISH !== 'skipped');
            let head;
            if (failed) {
              head = `❌ **${process.env.AGENT}** run failed. See the [workflow run](${process.env.RUN_URL}). @Hoshiko86`;
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-owner'] });
            } else if (process.env.PUSHED === 'true') {
              const next = process.env.CHAINED === 'true'
                ? 'Claude will re-check it.'
                : 'Comment `@claude review` for a new review.';
              head = `✅ **${process.env.AGENT}** pushed ${process.env.SHA.slice(0, 7)}; CI started. ${next}`;
            } else {
              head = `✅ **${process.env.AGENT}** finished with no changes to push.`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number,
              body: `${head}\n\n${report}`.trim() });
