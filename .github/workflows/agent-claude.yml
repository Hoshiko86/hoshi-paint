# Claude's role (CLAUDE.md): architecture, task breakdown and PR review.
# Claude never writes product code here. The review loop is automatic:
#
#   PR opened / ready for review, or "@claude review" from the owner or Codex
#     -> review: Claude posts one review comment and returns a verdict
#     -> fix: if there are in-scope fixes, Codex applies them on the PR branch
#        (agent-codex.yml, called directly: no copy and paste)
#     -> recheck: Claude checks the fix commit and posts the result
#        (agent-round.yml); if fixes are still open, Codex tries again.
#
# At most three rounds per review request; after round 3 anything still open
# goes to the owner. New pushes do not start a review: ask with "@claude review".
name: Claude (architect and reviewer)

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'synchronize' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
       contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per job, so comment events that skip every job never displace a queued review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # Read CI results and failing logs for the reviewed commit.
      actions: read
      checks: read
      statuses: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.sha.outputs.sha }}
      verdict: ${{ fromJSON(steps.review.outputs.structured_output || '{}').verdict }}
      fixes: ${{ fromJSON(steps.review.outputs.structured_output || '{}').fixes }}
    steps:
      - name: PR number
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Refuse fork PRs
        id: fork
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR),
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs are not reviewed by the agents.');
            }

      # Only main is checked out (trusted CLAUDE.md and settings). The PR is
      # read through the GitHub API at a pinned commit and never checked out.
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Reviewed commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@4a461cbbb72e467c61b1e47547fc0d7dacece34a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: chatgpt-codex-connector
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            You are the reviewer for Hoshi Paint. Codex implemented this PR; you do not edit files.
            REVIEWED COMMIT: ${{ steps.sha.outputs.sha }}
            The working directory is main. Read the PR's version of a file with
            `gh api repos/${{ github.repository }}/contents/PATH?ref=${{ steps.sha.outputs.sha }} -H "Accept: application/vnd.github.raw"`.
            Judge that commit only.

            1. Read CLAUDE.md (especially "PR review checklist" and "Nits are fixed in the PR")
               and AGENTS.md. Then read the issue this PR closes (`Closes #N` in the PR body):
               `gh issue view N`. That issue's Files, Do not touch, Tests and Stop condition
               sections are binding.
            2. Review `gh pr diff` against the issue and the checklist. Check that only the
               issue's files changed, dependency direction, no new unwrap/expect/panic outside
               tests, no new user-facing text outside both catalogs, no color literals outside
               theme.slint, atomicity and one history entry per edit, and tests unchanged or
               strengthened.
               CI: check `gh pr checks ${{ steps.pr.outputs.number }}`. If a check failed on the
               reviewed commit, read its log (`gh run view RUN_ID --log-failed`) and treat the
               failure as a finding: a fix if the cause is in this PR's files, otherwise
               needs_owner. If CI is still running, say so; the merge step waits for it.
            3. Post exactly ONE comment with `gh pr comment`:
               - First line: **Verdict:** Ready / Fixes queued for Codex / Needs the owner.
               - Findings only: `file:line`, scenario → fix, each labelled blocking or follow-up.
               - Findings outside this PR's files go under "Out of scope"; the owner decides
                 whether each becomes an issue or a Polish line.
               - If fixes are queued, say that Codex will apply them automatically.
            4. Return structured output:
               - verdict "ready": nothing to fix.
               - verdict "fixes": every needed fix is in files this PR already changes and
                 needs no decision from the owner. `fixes` lists each one as
                 "file:line → change", precise enough for Codex to apply without this
                 conversation.
               - verdict "needs_owner": anything needs a scope exception, a design decision
                 or files outside the PR, or any fix is under `.github/` (Codex may not edit
                 workflows). `fixes` is empty; explain in the comment.
            Never approve, merge, push, edit files, or open issues.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api repos/${{ github.repository }}/:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["ready","fixes","needs_owner"]},"fixes":{"type":"string"}},"required":["verdict","fixes"]}'

  # Any new push (by a person or Codex Cloud) withdraws Claude's "ready":
  # the new commit needs a new review before it can auto-merge.

      - name: Flag for the owner
        # Also when the review crashed or returned no usable verdict, so nothing stalls silently.
        if: |
          always() && steps.fork.outcome == 'success' &&
          (fromJSON(steps.review.outputs.structured_output || '{}').verdict == 'needs_owner' ||
           fromJSON(steps.review.outputs.structured_output || '{}').verdict == null ||
           (fromJSON(steps.review.outputs.structured_output || '{}').verdict == 'fixes' &&
            fromJSON(steps.review.outputs.structured_output || '{}').fixes == ''))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR);
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-owner'] });
            await github.rest.issues.createComment({ owner, repo, issue_number,
              body: `@Hoshiko86 this PR needs you: see the review above, or the [workflow run](${process.env.RUN_URL}) if none was posted.` });
  unready:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Remove agent-ready
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, name: 'agent-ready',
              });
            } catch (e) { if (e.status !== 404) throw e; }

  merge-after-review:
    needs: review
    if: needs.review.outputs.verdict == 'ready'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    uses: ./.github/workflows/agent-merge.yml
    with:
      pr: ${{ needs.review.outputs.pr }}
      sha: ${{ needs.review.outputs.sha }}
      mark_ready: true
    secrets: inherit

  # Up to three fix rounds per review request. Each round: Codex fixes, then
  # Claude re-checks and returns the next verdict. Round 3 never asks for more.
  round1:
    needs: review
    if: needs.review.outputs.verdict == 'fixes' && needs.review.outputs.fixes != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
      id-token: write
    uses: ./.github/workflows/agent-round.yml
    with:
      pr: ${{ needs.review.outputs.pr }}
      request: ${{ needs.review.outputs.fixes }}
      round: 1
      final: false
    secrets: inherit

  round2:
    needs: [review, round1]
    if: needs.round1.outputs.verdict == 'fixes' && needs.round1.outputs.fixes != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
      id-token: write
    uses: ./.github/workflows/agent-round.yml
    with:
      pr: ${{ needs.review.outputs.pr }}
      request: ${{ needs.round1.outputs.fixes }}
      round: 2
      final: false
    secrets: inherit

  round3:
    needs: [review, round2]
    if: needs.round2.outputs.verdict == 'fixes' && needs.round2.outputs.fixes != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
      id-token: write
    uses: ./.github/workflows/agent-round.yml
    with:
      pr: ${{ needs.review.outputs.pr }}
      request: ${{ needs.round2.outputs.fixes }}
      round: 3
      final: true
    secrets: inherit

  # Everything else the owner asks with "@claude": architecture questions, ADRs,
  # task breakdown into codex-task issues. Edits are limited to docs and the
  # agent instruction files.
  architect:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-architect-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Architect
        uses: anthropics/claude-code-action@4a461cbbb72e467c61b1e47547fc0d7dacece34a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 60
            --append-system-prompt "You are the architect for Hoshi Paint (see CLAUDE.md and docs/adr). Your job is architecture, ADRs, type design and breaking work into Codex tasks (codex-task issues: 1-2 files, Files / Do not touch / Tests / Stop condition, per CLAUDE.md). You do not write or change product code (Rust, Slint, build files): describe it in an issue for Codex instead. You may edit only docs/, CLAUDE.md and AGENTS.md, on a claude/ branch. Keep replies short and scannable: the owner reads on a phone."
            --allowedTools "Read,Glob,Grep,Edit(docs/**),Write(docs/**),Edit(CLAUDE.md),Edit(AGENTS.md),Bash(gh issue:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude/:*),Bash(git checkout -b claude/:*)"
