# Auto-merge (owner, 2026-11-24): a Codex PR merges by itself once Claude has
# said it is ready AND CI is green on the same commit. Owner-only work stays
# manual: only codex/* branches merge here, and never PRs that touch
# .github/ or docs/adr/.
#
# Ready signal: an `agent-review` commit status (success) on the exact commit
# Claude judged ready, set when the review or re-check verdict is "ready"
# (agent-claude.yml / agent-round.yml call this with mark_ready and that SHA).
# A status belongs to one commit, so any later push is unreviewed by
# construction. The `agent-ready` label mirrors it for people.
# Green signal: the CI workflow ("Desktop canvas and core") succeeded on the
# PR's head commit, code scanning finished (waited for here, up to 40 minutes,
# since its runs cannot trigger this workflow), and no check run failed. Either signal can arrive
# second, so this runs on both: when Claude marks ready, and when CI finishes.
#
# Merges made with GITHUB_TOKEN start no workflows, so after merging this
# dispatches the full CI run on main itself.
name: Agent auto-merge

on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      sha:
        description: The full commit SHA Claude judged ready.
        type: string
        required: true
      mark_ready:
        type: boolean
        required: true
  workflow_run:
    workflows: ["Desktop canvas and core"]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Up to ~40 minutes waiting for code scanning, plus margin.
    timeout-minutes: 50
    concurrency:
      group: agent-merge-${{ inputs.pr || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    steps:
      - name: Mark ready and merge when green
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_INPUT: ${{ inputs.pr }}
          READY_SHA: ${{ inputs.sha }}
          MARK_READY: ${{ inputs.mark_ready }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'agent-ready';
            const CI = 'Desktop canvas and core';

            // Find the PR: given by the caller, or the open PR whose head is the
            // commit CI just finished on.
            let number = Number(process.env.PR_INPUT || 0);
            if (!number) {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${process.env.RUN_BRANCH}`,
              });
              const match = prs.find(p => p.head.sha === process.env.RUN_SHA);
              if (!match) return core.info('No open PR at this commit.');
              number = match.number;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sha = pr.head.sha;

            if (process.env.MARK_READY === 'true') {
              if (process.env.READY_SHA !== sha) {
                return core.info(`#${number}: reviewed ${process.env.READY_SHA} but head is ${sha}; not marking ready.`);
              }
              await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'success',
                context: 'agent-review', description: 'Claude: ready to merge' });
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABEL] });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs-owner' });
              } catch (e) { if (e.status !== 404) throw e; }
            }

            const skip = (why) => core.info(`#${number} not merged: ${why}`);
            if (pr.state !== 'open') return skip('not open');
            if (pr.draft) return skip('draft');
            if (pr.head.repo.full_name !== `${owner}/${repo}`) return skip('fork');
            if (!pr.head.ref.startsWith('codex/')) return skip('not a codex/ branch');
            const labels = pr.labels.map(l => l.name);
            if (labels.includes('hold')) return skip('held by the owner');
            // Just marked above: GitHub can return the status list before the
            // new status shows up, so trust our own write in that case.
            if (process.env.MARK_READY !== 'true') {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              const review = combined.statuses.find(s => s.context === 'agent-review');
              if (!review || review.state !== 'success') return skip('Claude has not marked this commit ready');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number });
            const owned = files.map(f => f.filename).filter(f => f.startsWith('.github/') || f.startsWith('docs/adr/'));
            if (owned.length) return skip(`touches owner-only files: ${owned.join(', ')}`);

            // CI must have succeeded on this exact commit.
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: sha, per_page: 100 });
            const ci = runs.workflow_runs.filter(r => r.name === CI).sort((a, b) => b.run_number - a.run_number);
            if (!ci.length || ci[0].status !== 'completed') return skip('CI not finished on the head commit');
            if (ci[0].conclusion !== 'success') return skip(`CI ${ci[0].conclusion}`);

            // Judge only the latest run of each check: a dispatched CI run can
            // replace (cancel) an earlier pull_request run on the same commit.
            const latestChecks = async () => {
              const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
              const latest = new Map();
              for (const c of checks) {
                const prev = latest.get(c.name);
                if (!prev || new Date(c.started_at) > new Date(prev.started_at)) latest.set(c.name, c);
              }
              return [...latest.values()];
            };
            // Code scanning (GitHub's default CodeQL setup) runs outside our CI
            // and can finish later, especially the Rust analysis. Its runs
            // cannot trigger this workflow, so wait for them here: re-check
            // every minute for up to 40 minutes.
            const isScan = c => c.name === 'CodeQL' || c.name.startsWith('Analyze (');
            let checks = await latestChecks();
            for (let i = 0; i < 40 && checks.some(c => isScan(c) && c.status !== 'completed'); i++) {
              core.info(`Waiting for code scanning: ${checks.filter(c => isScan(c) && c.status !== 'completed').map(c => c.name).join(', ')}`);
              await new Promise(r => setTimeout(r, 60_000));
              checks = await latestChecks();
            }
            const pendingScan = checks.filter(c => isScan(c) && c.status !== 'completed');
            if (pendingScan.length) return skip(`code scanning still running: ${pendingScan.map(c => c.name).join(', ')}`);

            // No check on this commit may have failed.
            const bad = checks.filter(c => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(c.conclusion));
            if (bad.length) return skip(`failed checks: ${bad.map(c => c.name).join(', ')}`);

            // Re-read the PR: the head may have moved while waiting.
            const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (fresh.head.sha !== sha) return skip('head moved while waiting');
            pr.mergeable = fresh.mergeable;

            if (pr.mergeable === false) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number,
                body: '⚠️ @Hoshiko86 ready and green, but it has merge conflicts with main.' });
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs-owner'] });
              return skip('conflicts');
            }

            await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash', sha });
            await github.rest.issues.createComment({ owner, repo, issue_number: number,
              body: `✅ Auto-merged: Claude marked it ready and CI is green on ${sha.slice(0, 7)}.` });
            // GITHUB_TOKEN merges start no workflows: run the full CI on main.
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: 'main' });
